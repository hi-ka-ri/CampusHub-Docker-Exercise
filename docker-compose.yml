services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345$
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: campus-hub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345$
      MYSQL_DATABASE: campus_hub
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345$"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: